services:
  db:
    container_name: postgres
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d core_db" ]
      interval: 5s
      retries: 5
    restart: on-failure
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  cache:
    driver: local

